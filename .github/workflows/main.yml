name: Update Github Stats

on:
  schedule:
    - cron: "47 2 * * 1"  # weekly, Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install requirements
        run: npm install

      - name: Github Configurations
        run: |
          git config --global user.name "Github Actions"
          git config --global user.email "action@github.com"
          git pull

      - name: Update Template
        run: node updater.js "${{ github.repository_owner }}" atom
        env:
          GHT: ${{ secrets.GHT }}

      - name: Commit updated svg
        run: |
          git add .
          git commit -m "Github Stats updated 🎉" || echo "no changes"
          git push
